name: source-and-package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # macOS is the supported 1.0.8 platform. Linux runs generic tests and its
    # disposable Secret Service check as an experimental, unverified path.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, not just the tip. The version guard compares the shipped
          # tree against the tag its version claims; on the default shallow
          # clone that tag is absent, so the guard would call every version
          # unreleased and pass without enforcing anything.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify the release version is not being reused
        run: python3 tools/version_guard.py --verbose
      - name: Verify sanitized recipe catalog
        run: python3 tools/build_recipes.py --check
      - name: Verify Codex compatibility package
        run: python3 tools/build_codex_package.py --check
      - name: Verify public package
        run: python3 -m unittest discover -s tests -q
      - name: Hold per-module coverage floors
        # coverage-floor.json was recorded on macOS; one leg is enough, and the
        # gate reruns the whole suite under coverage.
        if: runner.os == 'macOS' && matrix.python-version == '3.14'
        run: |
          python3 -m pip install --disable-pip-version-check 'coverage==7.13.5' 'pytest==9.0.2'
          python3 tools/coverage_gate.py --check
      - name: Verify existing-tab browser bridge
        run: node --test tests/jev_browser.test.mjs
      - name: Verify native Linux Secret Service session with a disposable fixture
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools
          dbus-run-session -- bash -lc 'printf "%s" "jev-ci-keyring-password-fixture" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; JEV_RUN_NATIVE_SECRET_SERVICE=1 python3 -m unittest discover -s tests -p test_credential_store_linux_native.py -v'
