name: source-and-package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Keep the existing full-suite Linux and macOS lanes. Linux exercises the
    # Secret Service path; macOS exercises Keychain and the Apple-Silicon local
    # route. Windows has its own native support subset below because unrelated
    # POSIX-only suites still import fcntl at module load.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, not just the tip. The version guard compares the shipped
          # tree against the tag its version claims; on the default shallow
          # clone that tag is absent, so the guard would call every version
          # unreleased and pass without enforcing anything.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify the release version is not being reused
        run: python3 tools/version_guard.py --verbose
      - name: Verify sanitized recipe catalog
        run: python3 tools/build_recipes.py --check
      - name: Verify Codex compatibility package
        run: python3 tools/build_codex_package.py --check
      - name: Verify public package
        run: python3 -m unittest discover -s tests -q
      - name: Verify existing-tab browser bridge
        run: node --test tests/jev_browser.test.mjs
      - name: Verify native Linux Secret Service session with a disposable fixture
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools
          dbus-run-session -- bash -lc 'printf "%s" "jev-ci-keyring-password-fixture" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; JEV_RUN_NATIVE_SECRET_SERVICE=1 python3 -m unittest discover -s tests -p test_credential_store_linux_native.py -v'

  windows-native:
    # This is an explicit support lane, not the full suite. Several unrelated
    # POSIX-only modules import fcntl at module load and remain outside the
    # Windows contract until those modules are made portable deliberately.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify recipe catalog
        run: python tools/build_recipes.py --check
      - name: Verify native Windows private filesystem contract
        run: python -m unittest discover -s tests -p test_windows_platform_fs.py -v
      - name: Verify native Windows SQLite evidence-store ACLs
        run: python -m unittest discover -s tests -p test_windows_store_acl_native.py -v
      - name: Verify legacy Jevkit private-state boundary on Windows
        run: python -m unittest discover -s tests -p test_jevkit_windows_private.py -v
      - name: Verify native Windows named pipe contract
        run: python -m unittest discover -s tests -p test_windows_pipe_native.py -v
      - name: Verify production Windows IPC endpoint and private state
        run: python -m unittest discover -s tests -p test_windows_production_ipc.py -v
      - name: Verify production platform IPC and policy paths
        run: python -m unittest discover -s tests -p test_platform_ipc.py -v
      - name: Verify native host registration config plans
        run: python -m unittest discover -s tests -p test_host_registration_parity.py -v
      - name: Verify CLI workbench contracts
        run: python -m unittest discover -s tests -p test_cli_workbench.py -v
      - name: Verify Windows Codex and Claude profile config safety
        run: python -m unittest discover -s tests -p test_windows_host_registration_native.py -v
      - name: Verify OS credential adapter mocks
        run: python -m unittest discover -s tests -p test_credential_store_portability.py -v
      - name: Verify native Windows Credential Manager fixture CRUD
        run: python -m unittest discover -s tests -p test_windows_credential_store_native.py -v
      - name: Verify mechanical policy gate
        run: python -m unittest discover -s tests -p test_recipe_gate.py -v
      - name: Verify native command launchers and package entrypoints
        run: python -m unittest discover -s tests -p test_windows_launcher.py -v
