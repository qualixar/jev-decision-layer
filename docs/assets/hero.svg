  <text x="80" y="463" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#746d85" letter-spacing="1.1">55 RECIPES · PER-FOLDER CONSENT · LOCAL RECEIPTS · ADVISORY ANSWERS</text>
