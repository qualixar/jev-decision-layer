  <text x="1030" y="246" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e3ddff">consent · receipts</text>
  <rect x="1171" y="194" width="67" height="66" rx="18" fill="#fff" stroke="#d8d2ec"/>
