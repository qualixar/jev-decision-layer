  <title id="title">Qualixar Jev Decision Layer</title>
  <desc id="desc">An open-source decision layer for coding agents. One local runtime connects Codex, Claude Code, Antigravity, Hermes and VS Code to hosted Jev, with optional attested local Laya. The agent keeps execution authority.</desc>
