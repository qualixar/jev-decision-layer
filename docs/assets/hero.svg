  <polygon points="1192,227 1198,221 1202,226 1211,216 1217,221 1202,237" fill="#6252ce"/>
  <text x="1175" y="284" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#5145bb">ADVISORY</text>
  <text x="1175" y="303" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#5145bb">ONLY</text>
  <text x="78" y="83" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="18" font-weight="750" fill="#6555d2" letter-spacing="2.3">QUALIXAR · OPEN SOURCE · MIT</text>
  <text x="76" y="177" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="62" font-weight="820" fill="#201f2a">Jev Decision Layer</text>
  <text x="78" y="226" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="26" font-weight="620" fill="#4d4666">Typed decisions for your AI assistant.</text>
  <text x="78" y="270" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="20" fill="#655f76">Ask a closed question. Get a checked answer and a receipt.</text>
  <text x="78" y="302" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="20" fill="#655f76">Your assistant still decides, and still asks you before it acts.</text>
