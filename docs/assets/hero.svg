<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Qualixar Jev Decision Layer</title>
  <desc id="desc">An open-source decision layer for AI assistants. One local service connects Claude Code, Codex, VS Code, Antigravity and Hermes to hosted Jev, to local Laya on a Mac, or to both. Every answer is advice with a local receipt; the assistant keeps execution authority.</desc>
